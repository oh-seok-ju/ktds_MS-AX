id: "secret.api_key.generic"
label_kr: "인증정보/API 키"
label_en: "Secrets/API Keys"
severity: "critical"
action: ["block", "mask", "cite_policy"]
patterns:
  - type: "regex"
    id: "hex_key"
    description_kr: "일반적인 토큰/키 형태"
    description_en: "Generic token-like"
    pattern: '(?i)(?:api[_-]?key|secret|token|passwd|password)\s*[:=]\s*[''"]?[A-Za-z0-9_\-]{16,}[''"]?'
  - type: "regex"
    id: "bearer_jwt"
    description_kr: "JWT 토큰"
    description_en: "JWT token"
    pattern: '(?i)bearer\s+[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'
mask_ref: "secret"
suggestion_kr: "KeyVault/환경변수 사용. 하드코딩 금지."
suggestion_en: "Use KeyVault/env vars. Never hardcode."
